name: FeedBot
on:
  schedule:
    # This will run every five minutes. Alter it using https://crontab.guru/.
    - cron: '*/55 * * * *'
  workflow_dispatch: # This allows manually running the workflow from the GitHub actions page
concurrency:
  group: feedbot
jobs:
  rss-to-bluesky:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Node fetch
        run: |
          node - <<'EOF'
          fetch('https://philsci-archive.pitt.edu/cgi/latest_tool?output=RSS2')
            .then(async r => {
              console.log("status:", r.status);
              console.log("content-type:", r.headers.get("content-type"));
              const text = await r.text();
              console.log(text.slice(0, 500));
              require('fs').writeFileSync('node-feed.xml', text);
            })
            .catch(console.error);
          EOF
      - name: Debug feed XML
        run: |
          npm install @extractus/feed-extractor
          node - <<'EOF'
          const { extract } = require('@extractus/feed-extractor');
      
          extract("https://philsci-archive.pitt.edu/cgi/latest_tool?output=RSS2")
            .then(feed => {
              console.log("OK");
              console.log(feed.entries.length);
            })
            .catch(err => {
              console.error(err);
              process.exit(1);
            });
          EOF
      - name: Debug feed fetch
        run: |
          curl -sv -A "Mozilla/5.0 (compatible; GitHubActionsBot)" \
            https://philsci-archive.pitt.edu/cgi/latest_tool?output=RSS2 \
            -o feed-debug.xml
          echo "--- HTTP status/headers above ---"
          head -c 500 feed-debug.xml
      - uses: actions/upload-artifact@v4
        with:
          name: feed-debug
          path: feed-debug.xml
      - name: Generate cache key
        uses: actions/github-script@v6
        id: generate-key
        with:
          script: |
            core.setOutput('cache-key', new Date().valueOf())
      - name: Retrieve cache
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/blueskyfeedbot
          key: feed-cache-${{ steps.generate-key.outputs.cache-key }}
          restore-keys: feed-cache-
      - name: GitHub
        uses: 'joschi/blueskyfeedbot@v1'
        with:
          # This is the RSS feed you want to publish
          rss-feed: https://philsci-archive.pitt.edu/cgi/latest_tool?output=RSS2
          # Template of status posted to Bluesky (Handlebars)
          template: |
            New on the Archive:
            
            {{item.description}}

            {{item.link}}
          # This is your service URL (optional)
          service-url: https://bsky.social
          # This is the Bluesky username (example: username.bsky.social)
          username: ${{ secrets.BLUESKY_USERNAME }}
          # This is the app password you created earlier
          password: ${{ secrets.BLUESKY_PASSWORD }}
          # This is a path to the cache file, using the above cache path
          cache-file: ${{ github.workspace }}/blueskyfeedbot/cache.json
          # The maximum number of posts created on the first run
          initial-post-limit: 1
